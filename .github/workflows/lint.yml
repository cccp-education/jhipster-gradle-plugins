name: Lint

# LINT-ADOPT-13 (S-336) — the only existing workflow (`readme_truth.yml`) runs
# `commitGeneratedReadme`, never a gate, so the ktlint tasks added to `check`
# would never run in CI (a gate that cannot run is a false green, S-335 lesson).
# Minimal on purpose: one command, no `continue-on-error`, no trailing `echo` —
# the step's exit code IS the gate.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    name: Lint (ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlintCheck
        run: ./gradlew :persistence:ktlintCheck :assistant:ktlintCheck --no-daemon --console=plain
